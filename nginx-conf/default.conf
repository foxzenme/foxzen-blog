# S7修复：/api/refresh/是公开匿名、无需登录的写操作接口，CORS只能挡住
# 浏览器"读取跨域响应"，挡不住请求本身真正执行(no-cors POST从任何网站都
# 能触发)——真正的防刷必须在请求进入Flask/SQLite之前就拦住，而不是等
# 应用层的SQLite BEGIN IMMEDIATE和每个target 5分钟冷却生效之后才处理，
# 否则大量并发请求本身就可能让record_page_hit()等正常页面访问的写操作
# 因为SQLite文件级别的锁竞争而变慢/报"database is locked"。
# limit_req_zone必须定义在http{}上下文里；这个文件本身是被上层nginx.conf
# 通过include接入到http{}块内的一组server{}集合（这从文件本身包含多个
# 平级server块、没有自己的http{}包裹就能确认），所以直接写在这里、位于
# 所有server块之外，效果等同于写在http{}里。
# key用$binary_remote_addr（按访客IP），rate=30r/m(平均2秒一次)配合
# burst=10 nodelay：允许一个真实用户在页面上连续点击/刷新多次，但足以
# 挡住真正的洪水式请求；用与应用层cooldown拒绝一致的429状态码，保持
# 客户端体验统一。这条规则只影响下面mirror/backup两个server块里新增的
# /api/refresh/ location，不影响download.foxzen.me/foxzen.me等其它站点。
limit_req_zone $binary_remote_addr zone=refresh_api_zone:10m rate=30r/m;

server {
    listen 80;
    server_name mirror.foxzen.me;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name mirror.foxzen.me;
    ssl_certificate /etc/nginx/certs/mirror/mirror.crt;
    ssl_certificate_key /etc/nginx/certs/mirror/mirror.key;
    ssl_protocols TLSv1.3;
    root /usr/share/nginx/html;

    location = /robots.txt {
        try_files $uri =404;
    }
    location = /sitemap.xml {
        try_files $uri =404;
    }
	location = /29bfb801721343b798cc9dfca454d8af.txt {
        try_files $uri =404;
    }
    location ~ ^/posts/[^/]+/media/ {
        try_files $uri =404;
    }
    location /images/ {
        try_files $uri =404;
    }
    location /static/ {
        proxy_pass http://172.17.0.1:5000;
    }
    location /api/refresh/ {
        limit_req zone=refresh_api_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://172.17.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://172.17.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
server {
    listen 80;
    server_name foxzen.me;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name foxzen.me;
    ssl_certificate /etc/nginx/certs/foxzen/foxzen.crt;
    ssl_certificate_key /etc/nginx/certs/foxzen/foxzen.key;
    ssl_protocols TLSv1.3;
    root /usr/share/nginx/html/foxzen;
    index index.html;
    location /mirror/ {
        proxy_pass https://mirror.foxzen.me/;
        proxy_set_header Host mirror.foxzen.me;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
    location /gpg/ {
        try_files $uri $uri/ =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
server {
    listen 80;
    server_name download.foxzen.me;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name download.foxzen.me;
    ssl_certificate /etc/nginx/certs/foxzen/foxzen.crt;
    ssl_certificate_key /etc/nginx/certs/foxzen/foxzen.key;
    ssl_protocols TLSv1.3;
    auth_basic "课题组专用";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    location / {
        proxy_pass http://172.17.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 0;
    }
    location = /admin-refresh {
        auth_basic "管理专用";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd-admin;
        default_type text/html;
        alias /usr/share/nginx/html/foxzen-download-admin.html;
    }
    location = /refresh-cache {
        auth_basic "管理专用";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd-admin;
        proxy_pass http://172.17.0.1:5572/vfs/refresh?recursive=true;
        proxy_method POST;
    }
}
server {
    listen 80;
    server_name backup.foxzen.me;
    return 301 https://$host:8443$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name backup.foxzen.me;
    ssl_certificate /etc/nginx/certs/foxzen/foxzen.crt;
    ssl_certificate_key /etc/nginx/certs/foxzen/foxzen.key;
    ssl_protocols TLSv1.3;
    root /usr/share/nginx/html;

    location = /robots.txt {
        try_files $uri =404;
    }
    location ~ ^/posts/[^/]+/media/ {
        try_files $uri =404;
    }
    location /images/ {
        try_files $uri =404;
    }
    location /static/ {
        proxy_pass http://172.17.0.1:5000;
    }
    location /api/refresh/ {
        limit_req zone=refresh_api_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://172.17.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://172.17.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
